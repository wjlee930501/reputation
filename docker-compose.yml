services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reputation
      POSTGRES_PASSWORD: reputation
      POSTGRES_DB: reputation
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reputation"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # 호스트에도 노출한다. 컨테이너 밖에서 도는 백엔드 테스트 일부가 Celery 브로커를
    # redis://localhost:6379로 직접 잡는다 (예: tests/test_admin_domain.py의 도메인 검증
    # 디스패치). 노출하지 않으면 그 테스트만 브로커 접속 실패로 깨진다.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/gcp-key.json:ro
      - ./reports:/tmp/reports
      - sites_data:/tmp/sites
      - private_asset_uploads:/tmp/private_asset_uploads
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcp-key.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.core.celery_app worker --loglevel=info -Q default,content,sov,reports,leadgen,certificates -c 4
    volumes:
      - ./backend:/app
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/gcp-key.json:ro
      - ./reports:/tmp/reports
      - sites_data:/tmp/sites
      - private_asset_uploads:/tmp/private_asset_uploads
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcp-key.json
      SERVICE: worker
      CELERY_CONCURRENCY: "4"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A app.core.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      SERVICE: beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build: ./backend
    command: celery -A app.core.celery_app flower --port=5555 --basic-auth=${FLOWER_USER:?FLOWER_USER is required}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
    ports:
      - "127.0.0.1:5555:5555"
    env_file: .env
    environment:
      SERVICE: flower
    depends_on:
      - redis

volumes:
  postgres_data:
  sites_data:
  private_asset_uploads:
