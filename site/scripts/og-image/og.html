<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>OG Image</title>
<style>
  :root { --accent: #ff3d00; --ink: #0a0a0a; --g60: #6b6b6b; --g40: #a3a3a3; --g20: #dcdcdc; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #000; }
  body { font-family: "Pretendard", sans-serif; color: #fff; position: relative; -webkit-font-smoothing: antialiased; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 8px; background: var(--accent); }
  .copy { position: absolute; left: 72px; top: 92px; width: 600px; }
  .brand { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .brand span { margin-left: 8px; font-size: 18px; font-weight: 500; color: var(--g40); }
  .lead { margin-top: 64px; font-size: 26px; font-weight: 500; color: #cfcfcf; letter-spacing: -0.03em; }
  h1 { margin-top: 18px; font-size: 60px; line-height: 1.24; font-weight: 800; letter-spacing: -0.045em; }
  h1 em { font-style: normal; color: var(--accent); }
  .foot { position: absolute; left: 72px; bottom: 60px; font-size: 20px; font-weight: 500; color: var(--g40); letter-spacing: -0.01em; }
  .foot b { color: #fff; font-weight: 700; }

  .map { position: absolute; right: 64px; top: 92px; width: 400px; height: 446px;
         background: #f6f6f6 url("../../public/landing/local-map-bg.webp") center / cover no-repeat; overflow: hidden; }
  .map::after { content: ""; position: absolute; inset: 0; background: rgba(246,246,246,0.35); }
  .dot { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--g40); z-index: 1; }
  .pick, .ours { position: absolute; z-index: 2; display: grid; justify-items: center; gap: 7px; transform: translate(-50%, -16px); }
  .pin { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%;
         background: var(--accent); color: #fff; font-size: 16px; font-weight: 800; }
  .pin::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0.35; }
  .name { padding: 6px 11px; background: #fff; border: 1px solid var(--g20); color: var(--ink);
          font-size: 15px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
  .ours .pin { background: transparent; color: var(--accent); font-size: 19px; }
  .ours .pin::after { inset: -2px; border: 2.5px dashed var(--accent); opacity: 1; }
  .ours .name { background: var(--ink); border-color: var(--ink); color: #fff; }
</style>
</head>
<body>
  <div class="bar"></div>

  <div class="copy">
    <p class="brand">Re:putation<span>by MotionLabs</span></p>
    <p class="lead">이제 환자들은 AI에게 병원을 묻습니다.</p>
    <h1>우리 병원은 AI 답변에<br><em>잘 노출되고 있을까요?</em></h1>
  </div>
  <p class="foot"><b>AI 노출 진단</b> · ChatGPT · Gemini</p>

  <div class="map" id="map">
    <div class="pick" style="left:26%;top:22%"><span class="pin">1</span><span class="name">○○정형외과의원</span></div>
    <div class="pick" style="left:70%;top:40%"><span class="pin">2</span><span class="name">△△재활의학과의원</span></div>
    <div class="pick" style="left:34%;top:60%"><span class="pin">3</span><span class="name">□□마취통증의학과의원</span></div>
    <div class="ours" style="left:72%;top:80%"><span class="pin">?</span><span class="name">우리 병원?</span></div>
  </div>

<script>
  // 고정 시드 점 배치 — 랜딩 지도(LocalField)와 같은 방식. 표시 점·이름표 자리는 비운다.
  let a = 20260923;
  const rand = () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const W = 400, H = 446, marks = [[26,22],[70,40],[34,60],[72,80]].map(([x,y]) => [x/100*W, y/100*H]);
  const map = document.getElementById('map');
  for (let y = 20; y < H - 10; y += 30) for (let x = 16; x < W - 10; x += 30) {
    if (rand() < 0.38) continue;
    const px = x + (rand() - 0.5) * 16, py = y + (rand() - 0.5) * 16;
    if (marks.some(([mx, my]) => Math.abs(px - mx) < 95 && py - my > -34 && py - my < 52)) continue;
    const d = document.createElement('i'); d.className = 'dot';
    d.style.left = (px - 4.5) + 'px'; d.style.top = (py - 4.5) + 'px'; map.appendChild(d);
  }
</script>
</body>
</html>
