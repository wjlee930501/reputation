name: Isolated integrity rehearsal
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/integrity_rehearsal/**'
      - '.github/workflows/integrity-rehearsal.yml'
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Syntax check
        run: |
          bash -n scripts/integrity_rehearsal/run.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('scripts/integrity_rehearsal').glob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          PY
      - name: Build and rehearse in disposable internal network
        run: timeout --signal=TERM --kill-after=30s 17m bash scripts/integrity_rehearsal/run.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integrity-rehearsal-evidence
          path: scripts/integrity_rehearsal/artifacts/
          if-no-files-found: warn
