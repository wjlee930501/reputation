name: CI

on:
  pull_request:
  push:
    branches:
      - main

# 최소 권한 — 어떤 잡도 리포 쓰기/패키지 권한이 필요 없다.
permissions:
  contents: read

# 같은 ref에 새 푸시가 오면 진행 중인 이전 실행을 취소 (CI 자원 절약).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Makefile의 copy-guard / db-budget-guard와 동일한 검사. 두 스크립트 모두 표준
  # 라이브러리만 쓰므로 의존성 설치나 Postgres 없이 독립 잡으로 빠르게 돈다.
  guards:
    name: Copy and DB budget guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Copy guard (no internal terms in user-facing strings)
        run: python3 scripts/check_user_facing_terms.py

      - name: DB connection budget guard
        run: python3 scripts/check_db_connection_budget.py

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real Postgres so the integration suite (constraints, audit append-only
    # trigger, FK indexes — TEST-1) actually runs instead of skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reputation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # 일부 동시성·outbox 테스트는 애플리케이션 기본 DB와 격리된 전용 DB를
      # localhost:5434에서 사용한다. 별도 인스턴스를 유지해 테스트 간 DDL/트랜잭션
      # 간섭을 막고, 아래 단계에서 동일한 Alembic head까지 올린다.
      postgres_aux:
        image: postgres:16
        env:
          POSTGRES_USER: reputation
          POSTGRES_PASSWORD: reputation
          POSTGRES_DB: reputation_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U reputation -d reputation_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Admin API 통합 테스트의 rate-limit/revocation 경로는 실제 Redis 연결을
      # 사용한다. 프로덕션과 같은 실패 경계를 검증하도록 서비스로 제공한다.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      # tests/conftest.py가 test-admin-key로 강제 설정한다 — 여기 값과 어긋나도 무방하지만
      # 혼동을 줄이기 위해 동일 값 사용.
      ADMIN_SECRET_KEY: test-admin-key
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/reputation_test
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/reputation_test
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reputation_test
      # 블러 리포트 검사(F5-3)는 실제 PDF에서 텍스트를 추출해 가림 대상이 0회 등장하는지
      # 본다. 이 값이 없으면 그 테스트가 조용히 skip되어, 가장 중요한 검사가 어디에서도
      # 돌지 않게 된다 — CI에서는 네이티브 의존성을 깔고 강제 실행한다.
      REQUIRE_PDF_RENDER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install WeasyPrint native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Migrate test database
        run: python -m alembic upgrade head

      - name: Migrate auxiliary test database
        env:
          DATABASE_URL: postgresql+asyncpg://reputation:reputation@localhost:5434/reputation_test
          SYNC_DATABASE_URL: postgresql+psycopg2://reputation:reputation@localhost:5434/reputation_test
        run: python -m alembic upgrade head

      - name: Pytest (unit + integration, coverage gate)
        run: python -m pytest --cov=app --cov-report=term --cov-fail-under=60

  frontend:
    name: Frontend tests and builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - site
          - admin
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://reputation.co.kr
          NEXT_PUBLIC_API_URL: https://reputation.co.kr/api/v1/public
          NEXT_PUBLIC_BACKEND_URL: https://reputation.co.kr
          BACKEND_URL: https://reputation.co.kr
        run: npm run build

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pytest
        working-directory: .
        run: python -m pip install --upgrade pip pytest

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Deployment and Terraform policy tests
        working-directory: .
        run: python -m pytest scripts

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
            build_args: ""
          # site/admin은 NEXT_PUBLIC_* 가 빌드 시점에 번들로 인라인되며, site 설정은
          # 프로덕션 빌드에서 NEXT_PUBLIC_SITE_URL 누락 시 명시적으로 실패한다. CI는
          # 빌드 검증만 하므로 placeholder https URL을 주입한다(실제 값은 deploy.sh가 주입).
          - name: site
            context: site
            dockerfile: site/Dockerfile
            build_args: >-
              --build-arg NEXT_PUBLIC_SITE_URL=https://reputation.co.kr
              --build-arg NEXT_PUBLIC_API_URL=https://reputation.co.kr/api/v1/public
              --build-arg NEXT_PUBLIC_BACKEND_URL=https://reputation.co.kr
          - name: admin
            context: admin
            dockerfile: admin/Dockerfile
            build_args: >-
              --build-arg NEXT_PUBLIC_BACKEND_URL=https://reputation.co.kr
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 빌드만 검증 — 푸시 없음 (이미지 롤아웃은 scripts/deploy.sh 담당).
      - name: Build ${{ matrix.name }} image
        run: docker build ${{ matrix.build_args }} -f "${{ matrix.dockerfile }}" -t "ci-${{ matrix.name }}:${{ github.sha }}" "${{ matrix.context }}"

  # INFRA-4: Security scanning gate.
  #   - Dependency and secret audits are blocking release gates. A known high
  #     severity dependency issue or committed credential must fail CI.
  security:
    name: Security scans (deps + secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # gitleaks needs full history to scan commits

      # ── Backend dependency vulnerability scan (blocking) ──────────
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Backend pip-audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit .

      # ── Frontend dependency vulnerability scan (blocking) ─────────
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # 배포되는 코드(--omit=dev)만 본다. dev 전용 린트 툴체인 전이 취약점이 섞이면
      # 게이트가 항상 빨간불이 되어 아무도 보지 않게 된다. 고칠 수 없는 권고는
      # scripts/check_npm_audit.py의 ALLOWED에 근거·기한과 함께 명시한다.
      - name: Frontend npm audit (site, admin)
        run: python3 scripts/check_npm_audit.py site admin

      # ── Secret scanning (blocking) ────────────────────────────────
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
