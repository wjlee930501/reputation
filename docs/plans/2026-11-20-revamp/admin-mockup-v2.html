<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Re:putation 운영 어드민 · 개선 시안 v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --o:#FF3D00;--o2:#FF6A2B;--os:#FFF1EB;--os2:#FFE3D6;
  --ink:#111114;--g8:#3F3F46;--g6:#71717A;--g4:#A1A1AA;--g3:#D4D4D8;--g2:#E7E7EA;--g1:#F2F2F4;--bg:#F6F6F7;--card:#fff;
  --ok:#15803D;--oks:#E8F6EC;--wa:#B45309;--was:#FFF4E2;--bad:#DC2626;--bads:#FDECEC;--info:#2563EB;--infos:#EAF1FF;--off:#52525B;--offs:#EFEFF1;
  --r:18px;--sh:0 1px 2px rgba(17,17,20,.04),0 4px 16px rgba(17,17,20,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--ink);background:var(--bg);font-size:13.5px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;line-height:1.5}
button{font:inherit;cursor:pointer}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
a{color:inherit}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}

/* sidebar */
.sb{background:#0E0E10;color:#fff;padding:24px 14px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{font-weight:800;font-size:20px;letter-spacing:-.045em;padding:0 10px;display:flex;align-items:center;gap:8px}
.logo b{color:var(--o)}
.logo span{font-size:10.5px;font-weight:700;color:#fff;background:#26262A;border-radius:999px;padding:3px 8px;letter-spacing:0}
.env{margin:10px 10px 22px;font-size:11.5px;color:#8B8B93;display:flex;align-items:center;gap:7px}
.env i{width:7px;height:7px;border-radius:50%;background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav .grp{font-size:10.5px;font-weight:700;color:#5E5E66;padding:14px 12px 6px;letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:#C9C9CF;text-decoration:none;font-weight:600;cursor:pointer;transition:background .15s}
.nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav a:hover{background:#1B1B1F}
.nav a.on{background:var(--o);color:#fff}
.nav a .cnt{margin-left:auto;font-size:11px;font-weight:700;background:#26262A;color:#fff;border-radius:999px;padding:1px 8px}
.nav a .cnt.hot{background:var(--o);}
.nav a.on .cnt{background:rgba(0,0,0,.22)}
.sbft{margin-top:auto;padding:14px 10px 0;border-top:1px solid #1F1F23}
.me{display:flex;align-items:center;gap:10px;color:#E4E4E7;font-weight:600;font-size:12.5px}
.me small{display:block;color:#7A7A82;font-weight:500;font-size:11px}
.me .lo{margin-left:auto;color:#7A7A82;background:none;border:0;font-size:11.5px;white-space:nowrap}
.ver{font-size:10.5px;color:#56565E;margin-top:12px}

/* main */
.main{padding:30px 40px 80px;min-width:0}
.top{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.04em}
.top .d{font-size:12.5px;color:var(--g6);margin-top:3px}
.sp{flex:1}
.crumb{font-size:12.5px;color:var(--g6);margin-bottom:10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.crumb:hover{color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:11px;border:1px solid var(--g2);background:#fff;color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--g3);background:#FBFBFC}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--o);border-color:var(--o);color:#fff}
.btn.pri:hover{background:#F03800}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--g6)}
.btn.ghost:hover{background:var(--g1);color:var(--ink)}
.btn.danger{color:var(--bad)}
.ic{width:34px;height:34px;border-radius:10px;border:1px solid var(--g2);background:#fff;display:inline-grid;place-items:center}
.ic svg{width:16px;height:16px;stroke:var(--g8);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--oks)}
.pill.wa{color:var(--wa);background:var(--was)}
.pill.bad{color:var(--bad);background:var(--bads)}
.pill.info{color:var(--info);background:var(--infos)}
.pill.off{color:var(--off);background:var(--offs)}
.pill.br{color:var(--o);background:var(--os)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;font-size:11px;font-weight:700;background:var(--g1);color:var(--g8);white-space:nowrap}
.chip.o{background:var(--os);color:var(--o)}
.chip.wa{background:var(--was);color:var(--wa)}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px 24px}
.card+.card{margin-top:16px}
.grid>.card+.card,.panel>.card+.card{margin-top:0}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.ch h2{font-size:16px;font-weight:700;letter-spacing:-.03em}
.ch h2 small{font-size:12px;color:var(--g6);font-weight:500;margin-left:6px;letter-spacing:0}
.ch .n{font-size:11.5px;font-weight:700;background:var(--g1);color:var(--g8);border-radius:999px;padding:1px 9px}
.desc{font-size:12.5px;color:var(--g6);margin:-8px 0 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

/* KPI */
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .ki{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--g1);margin-bottom:14px}
.kpi .ki svg{width:17px;height:17px;stroke:var(--g8);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpi.o .ki{background:var(--os)} .kpi.o .ki svg{stroke:var(--o)}
.kpi.wa .ki{background:var(--was)} .kpi.wa .ki svg{stroke:var(--wa)}
.kpi .l{font-size:12px;color:var(--g6);font-weight:600}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.kpi .v small{font-size:14px;font-weight:600;color:var(--g6);margin-left:3px}
.kpi .s{font-size:11.5px;color:var(--g6);margin-top:4px}
.kpi.hero{background:var(--o);color:#fff}
.kpi.hero .l,.kpi.hero .s,.kpi.hero .v small{color:rgba(255,255,255,.85)}
.kpi.hero .ki{background:rgba(255,255,255,.18)} .kpi.hero .ki svg{stroke:#fff}
.kpi .ring{position:absolute;right:18px;top:18px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center}
.kpi .ring::after{content:attr(data-t);width:44px;height:44px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}

/* donut status */
.stbar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:8px 0 12px;background:var(--g1)}
.stbar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--g8)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:3px;display:block}

/* task list */
.task{display:grid;grid-template-columns:4px 40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--g1)}
.task:first-child{border-top:0}
.task .bar{width:4px;height:36px;border-radius:4px}
.task .tt{font-weight:700;font-size:13.5px}
.task .tm{font-size:12px;color:var(--g6);margin-top:2px}
.task .acts{display:flex;gap:6px}

/* hospital avatar */
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--o);color:#fff;flex:none}
.hav{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}

/* table */
.tw{overflow-x:auto;margin:0 -24px;padding:0 24px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:700;color:var(--g6);text-align:left;padding:10px 10px;border-bottom:1px solid var(--g2);white-space:nowrap;background:#FCFCFD}
th.sort::after{content:' ↕';color:var(--g4)}
td{padding:12px 10px;border-bottom:1px solid var(--g1);vertical-align:middle}
tr:hover td{background:#FCFCFD}
.hn{display:flex;align-items:center;gap:11px}
.hn b{font-weight:700;display:block;white-space:nowrap}
.hn small{font-size:11.5px;color:var(--g6)}
.url{display:inline-flex;align-items:center;gap:6px;max-width:260px}
.url a{color:var(--info);text-decoration:none;font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url a:hover{text-decoration:underline}
.cp{width:24px;height:24px;border-radius:7px;border:1px solid var(--g2);background:#fff;display:inline-grid;place-items:center;flex:none}
.cp svg{width:12px;height:12px;stroke:var(--g6);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cp.done{border-color:var(--ok)} .cp.done svg{stroke:var(--ok)}
.prog{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px}
.prog .pb{width:72px;height:6px;border-radius:99px;background:var(--g1);overflow:hidden}
.prog .pb i{display:block;height:100%;background:var(--o);border-radius:99px}
.muted{color:var(--g6)}
.ex{font-size:10px;font-weight:700;color:var(--g4);border:1px dashed var(--g3);border-radius:5px;padding:0 4px;margin-left:4px}

/* hospital header */
.hhead{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:22px 24px 0;margin-bottom:18px}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hrow h1{font-size:24px;font-weight:700;letter-spacing:-.04em}
.hmeta{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 16px;font-size:12.5px;color:var(--g6)}
.hmeta .it{display:flex;align-items:center;gap:7px}
.hmeta .it b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:0 -8px}
.tabs a{padding:12px 14px;font-weight:600;color:var(--g6);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--o)}
.tabs a .dot{width:6px;height:6px;border-radius:50%;background:var(--wa)}
.menuw{position:relative}
.menu{display:none;position:absolute;right:0;top:40px;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.14);padding:6px;min-width:190px;z-index:20}
.menu.on{display:block}
.menu div{padding:9px 12px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer}
.menu div:hover{background:var(--g1)}
.menu .sep{height:1px;background:var(--g1);padding:0;margin:4px 0}
.menu .danger{color:var(--bad)}

/* form */
.layout2{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.toc{position:sticky;top:20px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 10px}
.toc .t{font-size:10.5px;font-weight:700;color:var(--g4);padding:6px 10px 4px}
.toc a{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:9px;font-weight:600;color:var(--g8);cursor:pointer;font-size:12.5px;text-decoration:none}
.toc a:hover{background:var(--g1)}
.toc a.on{background:var(--os);color:var(--o)}
.toc a .req{font-size:10px;color:var(--ok);font-weight:700}
.toc a .chg{width:7px;height:7px;border-radius:50%;background:var(--wa)}
.fs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px}
.fs.c1{grid-template-columns:1fr}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.w2{grid-column:span 2}
.f label{font-size:12px;font-weight:700;color:var(--g8);display:flex;gap:6px;align-items:center}
.f label .op{font-weight:500;color:var(--g4)}
.f label .rq{color:var(--o)}
.in{min-height:40px;border:1px solid var(--g2);border-radius:11px;padding:9px 12px;font-size:13px;background:#fff;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.in.ta{white-space:normal;min-height:64px;line-height:1.55}
.in.ph{color:var(--g4)}
.in.sel{display:flex;justify-content:space-between;align-items:center}
.in.sel::after{content:'⌄';color:var(--g4)}
.in.chg{border-color:var(--wa);box-shadow:0 0 0 3px rgba(180,83,9,.08)}
.hint{font-size:11.5px;color:var(--g6)}
.sub{background:var(--g1);border-radius:14px;padding:16px;margin-top:4px}
.sub+.sub{margin-top:12px}
.subh{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:700;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--g2);border-radius:11px;padding:7px 8px;background:#fff;min-height:40px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:8px;background:var(--g1);font-size:12px;font-weight:600}
.tag::after{content:'×';color:var(--g4);font-weight:700}
.tags .add{font-size:12px;color:var(--g4);padding:0 4px}
.radio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rc{border:1.5px solid var(--g2);border-radius:14px;padding:14px;cursor:pointer;background:#fff}
.rc.on{border-color:var(--o);background:var(--os)}
.rc b{display:block;font-size:13px}
.rc span{font-size:11.5px;color:var(--g6)}
.rc .thumb{height:64px;border-radius:9px;margin-bottom:10px;background:linear-gradient(180deg,#E9E6E1 0 40%,#fff 40%)}
.seg{display:inline-flex;background:var(--g1);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg span{padding:6px 12px;border-radius:9px;font-size:12px;font-weight:600;color:var(--g6);cursor:pointer}
.seg span.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days span{width:38px;height:38px;border-radius:11px;border:1px solid var(--g2);display:grid;place-items:center;font-weight:700;font-size:12.5px;background:#fff}
.days span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hours{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px 10px;align-items:center}
.hours .dl{font-weight:700;font-size:12.5px}
.hours .dl.we{color:var(--o)}
.sw{width:36px;height:21px;border-radius:99px;background:var(--g3);position:relative;flex:none;display:inline-block;vertical-align:middle}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#fff}
.sw.on{background:var(--o)} .sw.on::after{left:18px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ph{border:1px solid var(--g2);border-radius:14px;overflow:hidden;background:#fff}
.ph .im{height:110px;background:linear-gradient(135deg,#EDE7DF,#D9D2C7);position:relative}
.ph .im .chip{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9)}
.ph .im .star{position:absolute;right:8px;top:8px;background:var(--o);color:#fff}
.ph .bd{padding:10px 12px}
.ph .bd b{font-size:12.5px;display:block}
.ph .bd small{font-size:11px;color:var(--g6);display:block;margin-top:2px}
.ph .ft{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--g1);font-size:11.5px;font-weight:600;white-space:nowrap}
.ph .ft .btn{padding:0 7px}
.drop{border:1.5px dashed var(--g3);border-radius:14px;padding:18px;text-align:center;color:var(--g6);font-size:12.5px;background:#FCFCFD}
.drop b{color:var(--o)}
.dns{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.dns td,.dns th{padding:9px 10px}
.steps{display:flex;gap:0;margin:6px 0 4px;flex-wrap:wrap}
.st{flex:1;min-width:110px;position:relative;padding-top:30px;font-size:11.5px;font-weight:600;color:var(--g6)}
.st::before{content:attr(data-n);position:absolute;top:0;left:0;width:22px;height:22px;border-radius:50%;background:var(--g2);color:var(--g8);display:grid;place-items:center;font-size:11px;font-weight:800}
.st::after{content:'';position:absolute;top:11px;left:26px;right:6px;height:2px;background:var(--g2)}
.st:last-child::after{display:none}
.st.done{color:var(--ink)} .st.done::before{background:var(--ok);color:#fff;content:'✓'} .st.done::after{background:var(--ok)}
.savebar{position:sticky;bottom:16px;margin-top:18px;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-radius:16px;background:var(--ink);color:#fff;box-shadow:0 12px 40px rgba(0,0,0,.2);flex-wrap:wrap;z-index:5}
.savebar .t{flex:1;min-width:200px;font-size:13px}
.savebar .t b{color:var(--o2)}
.savebar .btn{border-color:#333;background:#1E1E22;color:#fff}
.savebar .btn.pri{background:var(--o);border-color:var(--o)}
.note{display:flex;gap:10px;background:var(--infos);color:#1E3A8A;border-radius:12px;padding:11px 14px;font-size:12.5px;margin-bottom:14px}
.note.wa{background:var(--was);color:#7C2D12}
.foot{font-size:11.5px;color:var(--g6);margin-top:20px}

/* content list */
.stc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stc div{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:12px 14px;cursor:pointer;border:1.5px solid transparent}
.stc div.on{border-color:var(--o)}
.stc div.zero{opacity:.55}
.stc b{font-size:22px;font-weight:700;letter-spacing:-.03em;display:block}
.stc span{font-size:11.5px;color:var(--g6);font-weight:600}
.stc small{display:block;font-size:10.5px;color:var(--g4)}
.panel{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.drawer{background:#fff;border-radius:var(--r);box-shadow:0 12px 48px rgba(0,0,0,.1);overflow:hidden;position:sticky;top:20px}
.drawer .dh{padding:18px 20px;border-bottom:1px solid var(--g1)}
.drawer .db{padding:16px 20px;max-height:640px;overflow:auto}
.drawer .df{padding:12px 20px;border-top:1px solid var(--g1);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:12.5px}
.kv dt{color:var(--g6);font-weight:600}
.kv dd{font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0}
.chk i{width:18px;height:18px;border-radius:50%;background:var(--oks);color:var(--ok);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}

}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g&&V[g.dataset.go]){e.preventDefault();render(g.dataset.go);return;}
  const c=e.target.closest('.cp,.cpbtn'); if(c){try{navigator.clipboard.writeText(c.dataset.u)}catch(_){}c.classList.add('done');if(c.classList.contains('cpbtn')){const t=c.innerHTML;c.innerHTML=ic('chk')+'복사됨';setTimeout(()=>{c.innerHTML=t},1200)}setTimeout(()=>c.classList.remove('done'),1200);return;}
  const m=e.target.closest('.mbtn'); document.querySelectorAll('.menu.on').forEach(x=>{if(!m||x!==m.nextElementSibling)x.classList.remove('on')}); if(m){m.nextElementSibling.classList.toggle('on');return;}
  const a=e.target.closest('.acc>.ah'); if(a){a.parentElement.classList.toggle('open');return;}
  const s=e.target.closest('.seg span'); if(s){[...s.parentElement.children].forEach(x=>x.classList.remove('on'));s.classList.add('on');return;}
  const t=e.target.closest('.toc a'); if(t){t.parentElement.querySelectorAll('a').forEach(x=>x.classList.remove('on'));t.classList.add('on');return;}
  const sv=e.target.closest('.savebtn'); if(sv){const bar=sv.closest('.savebar');bar.querySelector('.t').innerHTML='<b>저장 완료</b> · 다음 사이트 갱신 때 반영';document.querySelectorAll('.in.chg').forEach(x=>x.classList.remove('chg'));document.querySelectorAll('.toc .chg').forEach(x=>x.remove());return;}
});
render((location.hash||'#dash').slice(1) in V?(location.hash||'#dash').slice(1):'dash');
</script>
</body>
</html>
